# Пример конфигурации avmonitor. Запуск: avmonitor.exe --config avmonitor.example.conf
# Формат и все ключи: docs/CONFIG.md. Комментарии только на отдельных строках (# или ;).
[monitor]

# Что наблюдать (ключ можно повторять) и что исключить.
watch = D:\Incoming
exclude = D:\Incoming\Trusted
priority = D:\Incoming

# Куда складывать улики и какую базу сигнатур использовать.
quarantine = D:\Evidence
db = db\signatures.db

# Производительность. Сейчас эти значения изменить можно только здесь (раньше нужно было править monitor.hpp).
threads = 2
debounce_ms = 750
stable_ms = 1000
max_size_mb = 512
queue_limit = 50000

# Реакция на события. etw требует прав администратора.
etw = false
block_exec = false
auto_quarantine = false

# Формат вывода в консоль: text или jsonl (одна строка JSON на событие).
events = text
