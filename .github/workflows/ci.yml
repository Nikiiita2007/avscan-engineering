name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (tests + ASan/UBSan + fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++ clang zlib1g-dev libarchive-dev
      - name: Release build + tests
        run: |
          cmake -S . -B build/linux -G Ninja -DAV_OFFLINE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/linux
          ctest --test-dir build/linux --output-on-failure
      - name: ASan + UBSan
        run: |
          cmake -S . -B build/sanitize -G Ninja -DCMAKE_CXX_COMPILER=clang++ \
            -DAV_OFFLINE=ON -DAV_ASAN=ON -DAV_UBSAN=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/sanitize
          ctest --test-dir build/sanitize --output-on-failure
      - name: libFuzzer smoke (2x60s)
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++ \
            -DAV_OFFLINE=ON -DAV_ASAN=ON -DAV_UBSAN=ON -DAV_FUZZ=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/fuzz --target fuzz_pe fuzz_archive
          mkdir -p /tmp/corpus
          cp tests/corpus/synthetic-pe.bin tests/corpus/regression-lfanew.bin tests/corpus/mz.bin tests/corpus/jpeg.bin \
             tests/corpus/clean.zip tests/corpus/limit.zip /tmp/corpus/
          ./build/fuzz/fuzz_pe /tmp/corpus -max_len=65536 -max_total_time=60 -timeout=5 -rss_limit_mb=1024 -print_final_stats=1
          ./build/fuzz/fuzz_archive /tmp/corpus -max_len=65536 -max_total_time=60 -timeout=5 -rss_limit_mb=1024 -print_final_stats=1

  tidy:
    name: clang-tidy (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang clang-tidy zlib1g-dev libarchive-dev
      - name: Build with clang-tidy
        run: |
          cmake -S . -B build/tidy -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DAV_OFFLINE=ON -DAV_TIDY=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/tidy 2>&1 | tee tidy.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: clang-tidy-report, path: tidy.log, if-no-files-found: ignore }

  windows:
    name: Windows x64 (MinGW cross-build + Wine smoke + MSI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build mingw-w64 wine64
      - name: Build zlib for MinGW
        run: |
          set -e
          curl -fsSL -o zlib.tar.gz https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xzf zlib.tar.gz && cd zlib-1.3.1
          cmake -S . -B b -G Ninja -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/scripts/mingw-toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=/usr/x86_64-w64-mingw32
          cmake --build b && sudo cmake --install b
          sudo mv /usr/x86_64-w64-mingw32/lib/libzlibstatic.a /usr/x86_64-w64-mingw32/lib/libz.a 2>/dev/null || true
          test -f /usr/x86_64-w64-mingw32/lib/libz.a
      - name: Build libarchive for MinGW
        run: |
          set -e
          curl -fsSL -o la.tar.xz https://github.com/libarchive/libarchive/releases/download/v3.7.7/libarchive-3.7.7.tar.xz
          tar xf la.tar.xz && cd libarchive-3.7.7
          cmake -S . -B b -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/scripts/mingw-toolchain.cmake -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DENABLE_OPENSSL=OFF -DENABLE_CNG=OFF -DENABLE_CPIO=OFF -DENABLE_TAR=OFF \
            -DENABLE_CAT=OFF -DENABLE_LIBB2=OFF -DENABLE_LZMA=OFF -DENABLE_LZO=OFF -DENABLE_ZSTD=OFF \
            -DENABLE_BZip2=OFF -DENABLE_LIBXML2=OFF -DENABLE_EXPAT=OFF -DENABLE_PCREPOSIX=OFF \
            -DENABLE_PCRE2POSIX=OFF -DENABLE_TEST=OFF
          cmake --build b
          sudo cp b/libarchive/libarchive.a /usr/x86_64-w64-mingw32/lib/
          sudo cp b/include/archive.h b/include/archive_entry.h /usr/x86_64-w64-mingw32/include/ 2>/dev/null \
            || sudo cp libarchive/archive.h libarchive/archive_entry.h /usr/x86_64-w64-mingw32/include/
          test -f /usr/x86_64-w64-mingw32/lib/libarchive.a
      - name: Cross-build AVScan
        run: |
          cmake --preset windows-mingw
          cmake --build build/win
      - name: Wine smoke tests
        env: { WINEDEBUG: '-all' }
        run: |
          cd build/win
          wine avscan.exe --selftest
          ZW="Z:${GITHUB_WORKSPACE//\//\\}"
          wine quality_tests.exe "$ZW\\db\\signatures.db" "$ZW\\tests\\corpus"
          wine avquarantine.exe list db
      - name: Package dist
        run: |
          mkdir -p dist/AVScan-Windows/db
          cp build/win/{avscan,avmonitor,avquarantine,avgui}.exe dist/AVScan-Windows/
          cp db/signatures.db dist/AVScan-Windows/db/
          cp installer/README-dist.txt dist/AVScan-Windows/README.txt 2>/dev/null || true
          cd dist && zip -r avscan-windows-x64.zip AVScan-Windows && cd ..
      - uses: actions/upload-artifact@v4
        with: { name: avscan-windows-x64, path: dist/ }

  windows-msvc:
    name: Windows x64 (MSVC native + vcpkg)
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Prepare vcpkg at the pinned baseline
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          $bl = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          Write-Host "Runner vcpkg HEAD: $(git -C $root rev-parse HEAD)"
          Write-Host "Pinned baseline:   $bl"
          git -C $root fetch origin $bl
          git -C $root checkout --detach $bl
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-
      - name: Configure (preset windows-vcpkg)
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset windows-vcpkg
      - name: Build
        shell: pwsh
        run: cmake --build build/windows --config Release
      - name: Tests
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure
      - name: Package dist (native MSVC build)
        shell: pwsh
        run: |
          $rel = "build/windows/Release"
          $dst = "dist/AVScan-Windows-MSVC"
          New-Item -ItemType Directory -Force "$dst/db" | Out-Null
          foreach ($e in 'avscan','avmonitor','avquarantine','avgui') { Copy-Item "$rel/$e.exe" $dst }
          Copy-Item "$rel/*.dll" $dst -ErrorAction SilentlyContinue
          Copy-Item db/signatures.db "$dst/db/"
          if (Test-Path installer/README-dist.txt) { Copy-Item installer/README-dist.txt "$dst/README.txt" }
          Push-Location $dst
          .\avscan.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "selftest of the packaged build failed" }
          Pop-Location
          Compress-Archive -Path $dst -DestinationPath dist/avscan-windows-x64-msvc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: avscan-windows-x64-msvc
          path: dist/avscan-windows-x64-msvc.zip
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avscan-msvc
          path: |
            build/windows/Release/*.exe
            build/windows/**/*.log
          if-no-files-found: ignore

  msi:
    name: MSI installer (WiX, Windows runner)
    runs-on: windows-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avscan-windows-x64, path: dist }
      - name: Build MSI
        shell: pwsh
        run: |
          mkdir -Force build/win | Out-Null
          Copy-Item dist/AVScan-Windows/*.exe build/win/
          if (-not (Get-Command wix -ErrorAction SilentlyContinue)) { dotnet tool install --global wix --version "6.*" }
          $env:DOTNET_ROLL_FORWARD = 'Major'
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix build -arch x64 -d BuildDir="$PWD/build/win" -d SourceDir="$PWD" installer/avscan.wxs -o build/avscan-0.4.0-x64.msi
      - uses: actions/upload-artifact@v4
        with: { name: avscan-msi, path: build/*.msi }

  release:
    name: Release (on tag)
    runs-on: ubuntu-latest
    needs: [linux, windows, windows-msvc, msi]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: avscan-windows-x64, path: dist-mingw }
      - uses: actions/download-artifact@v4
        with: { name: avscan-windows-x64-msvc, path: dist-msvc }
      - uses: actions/download-artifact@v4
        with: { name: avscan-msi, path: msi }
      - name: Prepare release assets
        run: |
          set -e
          mkdir -p assets
          cp dist-msvc/avscan-windows-x64-msvc.zip assets/
          cp dist-mingw/avscan-windows-x64.zip assets/avscan-windows-x64-mingw.zip
          cp msi/*.msi assets/
          cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "AVScan ${GITHUB_REF#refs/tags/v}" \
            --generate-notes \
            assets/*
