[workspace]
resolver = "2"
members = [
    "crates/avscan-protocol",
    "crates/avscan-manifest",
    "crates/orchestrator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
avscan-protocol = { path = "crates/avscan-protocol" }
avscan-manifest = { path = "crates/avscan-manifest" }
