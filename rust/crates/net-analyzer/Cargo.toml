[package]
name = "net-analyzer"
description = "Passive network traffic analyzer: pcap files and a localhost pcap stream"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "net_analyzer"
path = "src/lib.rs"

[[bin]]
name = "net-analyzer"
path = "src/main.rs"

[dependencies]
avscan-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
avscan-manifest.workspace = true
avscan-orchestrator = { path = "../orchestrator" }
tokio.workspace = true
